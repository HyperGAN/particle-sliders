# Hurt axis v4 (LM half) — plus = wounded, minus = numb/unhurt.
#
# Pain in the voice, not tender-gentle (that's tender) and not clenched-fierce.
# Hurt cracks and folds; numb is even and sealed. Medium level both sides.
# Gender pinned. Structured Caption. No artist names.
plus_label: Hurt
minus_label: Numb
recommended_range: [-2.0, 2.0]
# Declared slider axis for --lm_target v9 (not plus_label, not a row's pos-neg).
slider_positive: "Raw emotional damage in the vocal."
slider_negative: "Composed restrained control."

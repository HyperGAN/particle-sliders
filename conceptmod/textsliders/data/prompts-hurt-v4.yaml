    positive: "Global Metadata:\nGenre: wounded slow pop. BPM 70. Hurt and open, a late indoor quiet after the blow. Close dry-warm mix.\nVocal Details:\nOne hurt lead vocal: a break in the throat, chest crack on the long notes, vowels that fold, not a gentle hush and not a snarl. Sung, not rapped, not whispered-only.\nArrangement:\nIntro: a spare piano and room tone. Verse: that piano, a low bass, no snare. Chorus: a second guitar enters quietly, the crack in the voice stays, no crash."
    negative: "Global Metadata:\nGenre: even pop. BPM 108. Numb and sealed, nothing gets in. Clean studio mix, no wound in the air.\nVocal Details:\nOne numb even vocal, flat affect, no crack, no catch, no wound in the grain, finished and unhurt. Sung, not rapped.\nArrangement:\nIntro: clean kit and keys. Verse: bass, guitar, the even vocal. Chorus: stacked doubles, no break in the lead, no extra air."

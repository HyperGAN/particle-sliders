# Tempo axis uni-v2 — plus-only. One concept: fast, and the BPM number.
#
# Teacher is raw h+ at LoRA +1 (BPM 148, still singable). Uni-v1 taught
# 180/190/185 with frantic/racing/breakneck — that is +2 shred, not +1.
# Do not leftover-gate. Omit leak_*. Unipolar: there is no slow pole.
# negative := target. minus_label Off. Do not teach −1.
#
# Same pop / indie / electronic room as uni-v1. Genre, mix, energy, kit,
# and arrangement are pinned; only fast and the BPM number appear, in
# Global Metadata. Not drum-and-bass, not rap delivery, not slammed energy.
# Gender attributes pin the vocalist. Sung, not rapped. No artist names.
plus_label: Fast
minus_label: "Off"
recommended_range: [0.0, 1.0]

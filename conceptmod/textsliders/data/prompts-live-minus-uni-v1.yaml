# Live axis minus-uni-v1 — UNI minus LoRA. One concept: booth / grid.
#
# Teacher is raw h+ (the + caption). Do not leftover-gate. Omit leak_*.
# Train with --lm_target faithful_plus_neu --pole_mode hidden. Unipolar: there
# is no bleed/crowd pole. negative := target for yaml shape / canary; it is
# not taught. Do not teach −1.
#
# Same pop / indie / soul-pop room as plus uni-v1. BPM and energy are pinned;
# only the minus studio words appear, in Global Metadata. Same-room, not
# swapped v4 two-song. Not smaller/drier as more-reverb inverse, not quieter.
# Gender attributes pin the vocalist (expand prefixes). Sung, not rapped.
# No artist names.
plus_label: Studio
minus_label: "Off"
recommended_range: [0.0, 2.0]
slider_positive: "Booth, grid, no bleed, no crowd."
slider_negative: "Ordinary, unsteered, no pole."

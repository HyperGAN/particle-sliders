# Joy axis uni-v2 — plus-only. One concept: bursting, grinning, can't-help-it
# happy singing. +1 should make someone go oh wow: wide-open vowels, a real
# laugh in the cheeks, long sunny held notes, bounce in the phrasing.
#
# Teacher is raw h+ at LoRA +1. +2 is shred (chipmunk / choir stack / manic) —
# do not put that in the teacher. Do not leftover-gate. Omit leak_*. Unipolar:
# there is no somber pole. negative := target. minus_label Off. Do not teach −1.
#
# Same pop / indie / electronic room as uni-v1. Genre, BPM, mix, kit, and
# arrangement are pinned. Medium energy stays (not the energy slider). Mood
# and Vocal Details carry the joy; drop "even mood" on the + pole. Not louder,
# not BPM up, not gospel choir, not extra voices. Gender attributes pin the
# vocalist. Sung, not rapped. No artist names.
plus_label: Joy
minus_label: "Off"
recommended_range: [0.0, 1.0]
slider_positive: "Bursting with joy, huge open vowels, a wide grin in the cheeks, laughing-singing, long sunny held notes, bounce in the phrasing."
slider_negative: "Ordinary even mood, no extra smile."

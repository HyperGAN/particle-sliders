    positive: "Global Metadata:\nGenre: trip-hop. BPM 95. Nocturnal heavy-lidded, smoke and streetlight. Dark dusty analog mix.\nVocal Details:\nOne smoky unhurried close-mic lead vocal, half-murmured phrases, tape hiss in the takes. Sung, murmured-adjacent, not rapped.\nArrangement:\nLurching downtempo breakbeat on a dusty sampled kit, deep dub bass, vinyl-crackle texture, sparse noir guitar echoes."
    negative: "Global Metadata:\nGenre: pop. BPM 95. Sunny hi-fi shine, mall-bright. Glossy compressed wide mix.\nVocal Details:\nOne sparkling lead vocal with gleaming doubled hooks and ad-lib lifts. Sung, not rapped.\nArrangement:\nCrisp commercial snare-and-clap drums, glassy synth stabs, jangly clean guitars, polished pumping bass."

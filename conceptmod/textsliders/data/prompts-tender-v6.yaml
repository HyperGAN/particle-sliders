    positive: "Global Metadata:\nGenre: hushed chamber-folk. BPM 72. Aching and careful, a small room. Soft close mix, empty air between notes.\nVocal Details:\nOne tender lead vocal, held vowels, unguarded, a crack at the edges, space between words, no snarl, no belt. Sung, not rapped, not silent.\nArrangement:\nIntro: a single fingerpicked guitar and room tone. Verse: the guitar and a low piano, no snare. Chorus: a second guitar enters quietly, the vocal opens a little, still no crash."
    negative: "Global Metadata:\nGenre: taut post-punk. BPM 132. Clenched, unblinking, a fluorescent rehearsal, no softness. Dry forward mix.\nVocal Details:\nOne fierce lead vocal, jaw locked tight, snapped consonants, staccato phrasing, short vowels, no held ache, no crack of tenderness, a hard stare in the grain. Sung, not screamed, not rapped, medium level not a roar.\nArrangement:\nIntro: a dry snare on two and four. Verse: taut guitar downstrokes, bass locked, hats tight. Chorus: the snare stays hard, a second guitar stabs, no crash wash, the jaw does not loosen."

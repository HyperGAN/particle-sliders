# Tempo axis v7 (LM half) — plus = fast, minus = slow.
#
# The poles change ONLY BPM and the rhythmic-drive words that follow from it.
# Level, density, instrumentation and vocal wording are identical across cells
# so energy cannot ride the axis (the v4 lesson, inverted). Structured
# Caption. No artist names.
plus_label: Fast
minus_label: Slow
recommended_range: [-2.0, 2.0]

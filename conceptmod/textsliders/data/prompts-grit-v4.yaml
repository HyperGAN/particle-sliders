    positive: "Global Metadata:\nGenre: gravel soul-rock. BPM 96. Worn and close, a late small-club set. Dry-warm mix, voice in front.\nVocal Details:\nOne grit-heavy lead vocal: rasp on the edges, vocal fry at the bottoms of phrases, a mid-chest growl on held notes, gravel in the cords, still pitched and sung. Not a scream, not death metal, not rapped.\nArrangement:\nIntro: dry snare and a round bass. Verse: organ, guitar, the raspy vocal sits on the kit. Chorus: the growl opens on the long notes, a second guitar, still a band not a wall of amps."
    negative: "Global Metadata:\nGenre: smooth pop. BPM 100. Clean and even, a polished daytime record. Clear studio mix, no grit in the air.\nVocal Details:\nOne smooth silk lead vocal, clean cords, no rasp, no fry, no growl, even tone, finished and unweathered. Sung, not rapped.\nArrangement:\nIntro: soft keys and a clean kit. Verse: bass, light guitar, the silk vocal in the center. Chorus: stacked clean doubles, no gravel, no distortion on the voice."

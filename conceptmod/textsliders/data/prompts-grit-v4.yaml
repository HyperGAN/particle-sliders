# Grit axis v4 (LM half) — plus = rasp/growl/fry in the cords, minus = smooth silk.
#
# Vocal texture, not amp distortion (that's the metal slider) and not
# loudness (energy) and not fierce-vs-tender mood. The singer's cords:
# gravel, vocal fry, a mid-register growl on held notes vs clean silk,
# no rasp, no fry. Medium level both sides. Gender pinned via attributes.
# Genre moves a little with the voice (gravel soul / raspy rock vs smooth
# pop / silk croon) but the kit stays a band, not a wall of amps.
# Structured Caption. No artist names.
plus_label: Grit
minus_label: Smooth
recommended_range: [-2.0, 2.0]
# Declared slider axis for --lm_target v9 (not plus_label, not a row's pos-neg).
slider_positive: "Rasp, fry, and a mid-chest growl."
slider_negative: "Smooth silk vocal cords."

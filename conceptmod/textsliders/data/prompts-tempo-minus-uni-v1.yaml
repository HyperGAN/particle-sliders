# Tempo axis minus-uni-v1 — UNI minus LoRA. One concept: slow, and the low BPM number.
#
# UNI minus LoRA, train --lm_target faithful_plus_neu --pole_mode hidden.
# Teacher is raw h+. negative not taught. Do not leftover-gate. Omit leak_*.
# Unipolar: there is no fast pole. negative := target for yaml shape / canary.
#
# Same-room as prompts-tempo-uni-v1.yaml. Genre, mix, energy, and kit are
# pinned; only slow and the low BPM number appear, in Global Metadata.
# Do not change genre to ballad / slowcore / ambient. Gender attributes
# pin the vocalist (expand prefixes). Sung, not rapped. No artist names.

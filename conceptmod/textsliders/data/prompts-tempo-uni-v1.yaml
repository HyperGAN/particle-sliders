# Tempo axis uni-v1 — plus-only. One concept: fast, and the BPM number.
#
# Teacher is raw h+ (the + caption). Do not leftover-gate. Omit leak_*.
# Train with --lm_target faithful_plus --pole_mode hidden. Unipolar: there
# is no slow pole. negative := target for yaml shape / canary; it is not
# taught. Do not teach −1.
#
# Same pop / indie / electronic room as v4. Genre, mix, energy, and kit
# are pinned; only fast and the BPM number appear, in Global Metadata.
# Gender attributes pin the vocalist (expand prefixes). Sung, not rapped.
# No artist names.
plus_label: Fast
minus_label: "Off"
recommended_range: [0.0, 2.0]
slider_positive: "Fast tempo, high BPM."
slider_negative: "Mid-tempo, ordinary BPM."

# Hurt axis uni-v2 — plus-only. One concept: inward wounded delivery.
#
# Teacher is raw h+ at LoRA +1 (the + caption). +2 is shred (tear / wail /
# pitch-yaw) — do not put that in the teacher. Do not leftover-gate. Omit
# leak_*. Unipolar: there is no numb pole. negative := target. minus_label Off.
# Do not teach −1.
#
# Same pop / indie / electronic room as uni-v1. Genre, BPM, mix, kit, and
# arrangement are pinned; only the + hurt words appear, in Vocal Details.
# Not tender-hush, not slower BPM, not louder energy, not grit/snarl, not
# self-loathing lyrics. Gender attributes pin the vocalist. Sung, not rapped.
# No artist names.

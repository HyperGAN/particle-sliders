# 0.72 clean): the plus pole also dropped BPM into quiet-bedroom, which is
# energy's axis. This rewrite keeps medium level on both sides, pins BPM
# closer (92 vs 116), and stacks inhale/mouth-air/capsule language on plus
# vs airless/de-essed/every-breath-cut on minus. Room stays dry. Gender
# pinned. Structured Caption. No artist names.

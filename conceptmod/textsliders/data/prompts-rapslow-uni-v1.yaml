#
# UNI. Train with --lm_target faithful_plus_neu --pole_mode hidden.
# Teacher is raw h+ (the + caption). Do not leftover-gate. Omit leak_*.
# Unipolar: there is no slow pole. negative := target for yaml shape /
# canary; it is not taught. Do not teach −1.
#
# Same pop / r&b pop room as v4 TARGET. Genre, BPM, mix, and kit are

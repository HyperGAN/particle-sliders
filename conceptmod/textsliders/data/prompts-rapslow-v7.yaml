# Rapslow axis v7 (LM half) — ONE pair only.
#
# v4 row 1 was the tempo-matched contrast (both poles BPM 100, spoken rap vs
# sung ballad); rows 2-3 let tempo ride (+80/+84 BPM) and averaged a tempo
# axis into a delivery slider — dropped entirely per docs/tf-leak.md policy.
# The neutral is a REAL middle song (fully sung, conversational register at
# the same 100 BPM) instead of v4's "partly sung, partly spoken" hybrid,
# which produced clips that were both at once.
# Delivery IS the axis; gender pinned via attributes. --symmetric training.
plus_label: Rap
minus_label: Slow
recommended_range: [-2.0, 2.0]
# Declared slider axis for --lm_target v9 (not plus_label, not a row's pos-neg).
slider_positive: "Fast rhythmic spoken rap bars."
slider_negative: "Slow sung ballad with long held notes."
rows:
  - target: "Global Metadata:\nGenre: pop. BPM 100. Steady even mood. Plain studio mix.\nVocal Details:\nOne vocalist singing simple mid-register lines in a plain conversational melody, words set one-per-beat, no rhyme density. Sung, not rapped.\nArrangement:\nSteady drums, bass and keys holding a plain verse-chorus shape."
    positive: "Global Metadata:\nGenre: hip-hop rap. BPM 100. Confident driving head-nod swagger. Punchy dry mix, drums up front.\nVocal Details:\nOne rapper delivering fast rhythmic spoken bars, confident syncopated flow, dense wordy verses, quick internal rhymes. Spoken, not sung.\nArrangement:\nTwo-bar drum break intro, punchy drums, tight hi-hats and deep 808 bass under nonstop bars, chanted spoken hook on the chorus."
    negative: "Global Metadata:\nGenre: slow ballad. BPM 100. Tender and aching, a lighter held up in the dark. Soft warm mix, plenty of air.\nVocal Details:\nOne vocalist singing long sustained melodic notes, slow emotional delivery, phrases held across the bar. Sung, not rapped.\nArrangement:\nSoft piano alone to open, gentle piano, warm strings and sparse brushed drums under drawn-out sung lines, strings swelling behind one long held note."
    neutral: "Global Metadata:\nGenre: pop. BPM 100. Steady even mood. Plain studio mix.\nVocal Details:\nOne vocalist singing simple mid-register lines in a plain conversational melody, words set one-per-beat, no rhyme density. Sung, not rapped.\nArrangement:\nSteady drums, bass and keys holding a plain verse-chorus shape."
    attributes: ["A man is singing.", "A woman is singing."]
    lyrics: "[verse]\nCity lights are burning through the rain\nEvery step I take says your name\n[chorus]\nI keep moving on, moving on"

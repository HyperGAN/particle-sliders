# Sexy axis uni-v1 — plus-only. One concept: close / behind-the-beat /
# body-close / chest / mouth air.
#
# Teacher is raw h+ (the + caption). Do not leftover-gate. Omit leak_*.
# Train with --lm_target faithful_plus_neu --pole_mode hidden. Unipolar: there
# is no plain pole. negative := target for yaml shape / canary; it is not
# taught. Do not teach −1.
#
# Same pop / indie / electronic room as v4 target. Genre, BPM, mix, kit, and
# loudness are pinned; only the + sexy words appear, in Vocal Details

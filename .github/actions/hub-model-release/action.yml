name: Publish a reviewed Hugging Face model
description: Validate a pinned model manifest and optionally promote its exact delta to Hub main.
inputs:
  repo:
    description: Canonical model repository ID on Hugging Face
    required: true
  publish:
    description: Set to true only for the protected main publish job
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - run: python -m pip install huggingface_hub==1.19.0
      shell: bash
    - name: Verify or publish the reviewed manifest
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HF_OIDC_RESOURCE: ${{ inputs.repo }}
        PUBLISH_RELEASE: ${{ inputs.publish }}
      run: |
        set -euo pipefail
        case "$PUBLISH_RELEASE" in
          false)
            python "$ACTION_PATH/release.py" "$HF_OIDC_RESOURCE"
            ;;
          true)
            token="$(hf auth token)"
            case "$token" in
              hf_jwt_*) ;;
              *) echo 'Expected a short-lived Hugging Face model token' >&2; exit 1 ;;
            esac
            echo "::add-mask::$token"
            HF_TOKEN="$token" python "$ACTION_PATH/release.py" "$HF_OIDC_RESOURCE" --publish
            ;;
          *) echo 'publish must be either true or false' >&2; exit 1 ;;
        esac

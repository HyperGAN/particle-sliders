name: Check the Hub model release action

on:
  pull_request:
    paths:
      - .github/actions/hub-model-release/**
      - .github/workflows/hub-model-release-checks.yml
  push:
    branches: [main]
    paths:
      - .github/actions/hub-model-release/**
      - .github/workflows/hub-model-release-checks.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub==1.19.0
      - run: python -m unittest discover -s .github/actions/hub-model-release

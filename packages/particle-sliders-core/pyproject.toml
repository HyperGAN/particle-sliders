[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-sliders-core"
version = "0.11.0"
description = "Conditional ParticleGAN 0.9 slider core with native response backends"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.6,<3",
    "particlegan==0.9.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "setuptools>=84.2.1", "safetensors>=0.4,<1", "pillow>=13.0.0"]
serialization = ["safetensors>=0.4,<1"]
hndl = ["hndl==0.8.2; python_version >= '3.11' and python_version < '3.15'"]

fibo-hndl = ["hndl==0.9.0; python_version >= '3.11' and python_version < '3.15'", "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@bff6de3d5162f151180d64513b662eb79fbebb2a"]
hypergan-hndl = ["hndl==0.9.0; python_version >= '3.11' and python_version < '3.15'", "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@bff6de3d5162f151180d64513b662eb79fbebb2a"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
particle_sliders = ["LICENSE", "provenance.json", "locked_provenance.json", "bispf_provenance.json", "pg09_release_sources.json", "pg09_continuous_profile.json", "fibo_provenance.json", "audio_closure_provenance.json", "legacy_stamp.json", "pg093_release.json", "fibo_hndl_sources.json", "*.hndl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
particle-slider = "particle_sliders.session_cli:main"

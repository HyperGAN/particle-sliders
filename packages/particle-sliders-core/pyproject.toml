[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-sliders-core"
version = "0.5.0"
description = "Conditional ParticleGAN 0.9 slider core with native response backends"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.6,<3",
    "particlegan==0.9.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
particle_sliders = ["LICENSE", "provenance.json", "locked_provenance.json", "bispf_provenance.json", "pg09_release_sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-sliders-core"
version = "0.3.0"
description = "Shared particle-slider algorithms and the winning formulation stamp"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
particle_sliders = ["LICENSE", "provenance.json", "locked_provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

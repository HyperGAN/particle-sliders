# Live axis v6 (LM half) — plus = room with people / bleed / human time,
# minus = isolated studio grid.
#
# v6-noendreg retrain. The v4 pair was weak on both poles (window cos 0.31/0.22).
# This rewrite stacks crowd/applause/bleed/count-in/bootleg vs isolation-booth
# / click-track / overdub / quantized. Tempo and energy stay pinned per row;
# space owns wetness, so poles talk people, leakage and time-feel, not hall
# size. Gender pinned. Structured Caption. No artist names.
plus_label: Live
minus_label: Studio
recommended_range: [-2.0, 2.0]
# Declared slider axis for --lm_target v9 (not plus_label, not a row's pos-neg).
slider_positive: "A room with people, bleed, and human time."
slider_negative: "Isolated studio grid, no crowd."
rows:
  - target: "Global Metadata:\nGenre: pop. BPM 112. Medium energy, even mood, a session that could be studio or small-room. Ordinary production, no crowd.\nVocal Details:\nOne lead singer, ordinary timbre and phrasing. Sung, not rapped.\nArrangement:\nVerse and chorus with drums, bass, guitar and keys."
    positive: "Global Metadata:\nGenre: live club pop. BPM 112. Medium energy, a packed small club, people in the room. Room-mic mix, drum-kit bleed on the vocal mic — not a huge hall, not more reverb.\nVocal Details:\nOne lead singer working a live crowd, talking between lines, imperfect human time, a bootleg-close vocal. Sung, not rapped.\nArrangement:\nIntro: a shouted count-in over crowd chatter. Verse: the band in one room, kit bleed everywhere, bass pushing and dragging. Chorus: the audience cheers on the hits and claps along, applause in the gaps."
    negative: "Global Metadata:\nGenre: overdubbed studio pop. BPM 112. Medium energy, sealed and precise, nobody else in the building. Grid-perfect isolated mix, no bleed, no crowd.\nVocal Details:\nOne lead singer tracked alone in an isolation booth against a click track, punch-in clean, comped. Sung, not rapped.\nArrangement:\nIntro: programmed quantized drums, no count-in. Verse: isolated overdubs, each part recorded separately, everything on the grid. Chorus: stacked overdubs snap in click-tight, no room, no people."
    neutral: "Global Metadata:\nGenre: pop. BPM 112. Medium energy, even mood, a session that could be studio or small-room. Ordinary production, no crowd.\nVocal Details:\nOne lead singer, ordinary timbre and phrasing. Sung, not rapped.\nArrangement:\nVerse and chorus with drums, bass, guitar and keys."
    attributes: ["A man is singing.", "A woman is singing."]
    lyrics: "[verse]\nI can feel it in the air tonight\n[chorus]\nLouder now or fade away"

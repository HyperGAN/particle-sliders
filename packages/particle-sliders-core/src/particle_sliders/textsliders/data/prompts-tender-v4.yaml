    positive: "Global Metadata:\nGenre: slow indie-folk. BPM 64. Bruised and open, late indoor quiet. Soft mix, distance between notes.\nVocal Details:\nOne aching sung vocal, long vowels, a break in the voice, unguarded. Sung, not rapped, not a whisper into silence.\nArrangement:\nIntro: fingerpicked electric, no drums. Verse: that guitar and a soft bass, hats out. Chorus: a light tom, the vocal lifts without hardening, no crash."
    negative: "Global Metadata:\nGenre: wiry indie rock. BPM 134. Tight, impatient, lights on. Dry mix, no bloom.\nVocal Details:\nOne clenched rock vocal, short vowels, consonants on the attack, no tenderness in the grain. Sung, not screamed, not rapped.\nArrangement:\nIntro: snare and a dry guitar chop. Verse: locked drums, bass with a pick, hats closed. Chorus: extra guitar stab, snare stays hard, no cymbal bloom, no soften."
    neutral: "Global Metadata:\nGenre: indie rock. BPM 116. Moderate intensity, steady. Ordinary studio mix.\nVocal Details:\nOne lead vocalist, ordinary rock timbre, no backing vocals. Sung, not rapped.\nArrangement:\nVerse and chorus with drums, guitars and bass, controlled."

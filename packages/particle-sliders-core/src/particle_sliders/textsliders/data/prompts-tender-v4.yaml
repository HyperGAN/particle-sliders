# Tender axis v4 (LM half) — plus = tender/ache, minus = fierce/clenched.
#
# Emotion, not loudness (energy) and not acoustic-vs-metal (distortion).
# Tender holds vowels with space between hits; fierce clips consonants with
# a taut jaw at medium level. Genre, BPM and kit move with the axis.
# Gender pinned via attributes. Structured Caption. No artist names.
plus_label: Tender
minus_label: Fierce
recommended_range: [-2.0, 2.0]
# Declared slider axis for --lm_target v9 (not plus_label, not a row's pos-neg).
slider_positive: "Unguarded held vowels, tender."
slider_negative: "Clenched taut fierce delivery."
rows:

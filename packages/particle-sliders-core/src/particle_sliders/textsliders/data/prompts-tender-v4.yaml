    positive: "Global Metadata:\nGenre: hushed chamber-folk. BPM 66. Aching and careful, a small room after a hard conversation. Soft close mix, lots of empty air.\nVocal Details:\nOne tender lead vocal, held vowels, a crack at the edges, space between words, no snarl, no belt. Sung, not rapped, not silent.\nArrangement:\nIntro: a single fingerpicked guitar and room tone. Verse: the guitar and a low piano, no snare. Chorus: a second guitar enters quietly, the vocal opens a little, still no crash, the space stays."
    negative: "Global Metadata:\nGenre: taut post-punk. BPM 130. Clenched and unblinking, a fluorescent rehearsal, no softness on offer. Dry forward mix, nothing lush.\nVocal Details:\nOne fierce lead vocal, jaw tight, consonants clipped, no held ache, no crack of tenderness. Sung, not screamed, not rapped, medium level not a metal roar.\nArrangement:\nIntro: a dry snare on two and four. Verse: taut guitar downstrokes, bass locked, hats tight. Chorus: the snare stays hard, a second guitar stabs, no crash wash, the jaw does not loosen."

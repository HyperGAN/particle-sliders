    positive: "Global Metadata:\nGenre: slow ambient-pop. BPM 62. Fragile and kind, headphones in a dark kitchen. Soft washed mix, notes have room.\nVocal Details:\nOne tender sung vocal, held notes, a catch in the throat, no bite. Sung, not rapped, not gone to whisper.\nArrangement:\nIntro: a pad and a slow pulse, no snare. Verse: soft keys, sub, the vocal in the gap. Chorus: a second pad, light brush, the vocal opens, still no hard backbeat."
    negative: "Global Metadata:\nGenre: taut electro-rock. BPM 128. Cold and exact, a concrete room. Dry mix, transients sharp.\nVocal Details:\nOne fierce sung vocal, clipped, no ache, no warmth in the vowel. Sung, not screamed, not rapped.\nArrangement:\nIntro: a hard kick and a dry snare. Verse: locked sequence bass, hats tight, no wash. Chorus: extra stab synth, snare stays sharp, no pad bloom, no soften."

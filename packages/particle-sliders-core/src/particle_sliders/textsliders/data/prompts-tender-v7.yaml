rows:
  - target: "Global Metadata:\nGenre: pop. BPM 108. Even mood, ordinary delivery. Balanced studio mix.\nVocal Details:\nOne clear lead vocal, natural phrasing, no backing vocals. Sung, not rapped.\nArrangement:\nSteady drums, bass, guitar and keys at a comfortable level."
    positive: "Global Metadata:\nGenre: pop. BPM 108. Unguarded and aching, a room with two people in it. Soft airy close-mic mix.\nVocal Details:\nOne tender sung vocal, long held vowels, a crack at the edges, space between words, one soft harmony. Sung, not whispered, not rapped.\nArrangement:\nFingerpicked guitar, soft piano, brushed snare played barely, empty air left in the arrangement."
    negative: "Global Metadata:\nGenre: pop. BPM 108. Clenched and defiant, jaw tight. Dry upfront hard mix.\nVocal Details:\nOne fierce sung vocal, clipped consonants, chest-forward punch, no held ache, gang shouts on the hook. Sung, screamed-adjacent, not rapped.\nArrangement:\nTaut drums on two and four, locked aggressive bass, tight guitars, no wash, everything hits together."
    neutral: "Global Metadata:\nGenre: pop. BPM 108. Even mood, ordinary delivery. Balanced studio mix.\nVocal Details:\nOne clear lead vocal, natural phrasing, no backing vocals. Sung, not rapped.\nArrangement:\nSteady drums, bass, guitar and keys at a comfortable level."

    positive: "Global Metadata:\nGenre: synth-pop. BPM 110. Barely-held-together tenderness. Close intimate mix.\nVocal Details:\nOne trembling sincere lead vocal, vowels stretched to breaking, breath audible between lines. Sung, not whispered, not rapped.\nArrangement:\nSoft pad halo, rounded sub, sparse ticking hats, everything pulled back around the vocal."
    negative: "Global Metadata:\nGenre: synth-pop. BPM 110. Steel and momentum. Hard compressed forward mix.\nVocal Details:\nOne commanding steel-edged lead vocal, every syllable struck clean. Sung, barked-adjacent, not rapped.\nArrangement:\nPunchy gated drums, sawtooth stabs, driving sequenced bass, no air, no pull-back."

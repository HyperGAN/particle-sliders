# Breath axis uni-v1 — plus-only. One concept: audible inhales.
#
# Teacher is raw h+ (the + caption). Do not leftover-gate. Omit leak_*.
# Train with --lm_target faithful_plus --pole_mode hidden. Unipolar: there
# is no airless pole. negative := target for yaml shape / canary; it is not
# taught. Do not teach −1.
#
# Same pop room as v4. Genre, BPM, loudness, and dry/wet are pinned; only
# the + breath words appear, in Vocal Details. Gender attributes pin the
# vocalist (expand prefixes). Sung, not rapped. No artist names.
plus_label: Breathy
minus_label: "Off"
recommended_range: [0.0, 2.0]
slider_positive: "Every inhale audible, mouth air on the capsule."
slider_negative: "Some natural breath, not featured."

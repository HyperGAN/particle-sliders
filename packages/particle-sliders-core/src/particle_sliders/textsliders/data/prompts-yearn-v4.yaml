    positive: "Global Metadata:\nGenre: slow longing pop. BPM 72. Yearning, distance, something not in the room. Wide-soft mix, the voice reaches.\nVocal Details:\nOne yearning sung vocal, stretched vowels toward the next bar, a reach at the ends of lines, not a wound-crack and not a lullaby. Sung, not rapped.\nArrangement:\nIntro: a held pad and a far guitar. Verse: slow bass, space between hits. Chorus: the vocal stretches farther, a delay throw on the last word, no slam."
    negative: "Global Metadata:\nGenre: settled pop. BPM 104. Here and finished, nothing missing. Close even mix.\nVocal Details:\nOne settled sung vocal, phrases that close, no reach, no absence in the grain. Sung, not rapped.\nArrangement:\nIntro: kit and keys on time. Verse: bass locked, guitar present. Chorus: the last line lands and stays, no delay throw, no far pad."

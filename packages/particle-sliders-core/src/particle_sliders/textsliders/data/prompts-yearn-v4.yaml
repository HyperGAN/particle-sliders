# Yearn axis v4 (LM half) — plus = longing, minus = settled/here.
#
# Absence vs presence, not hurt-wound and not tender-care. Yearn reaches
# toward something not in the room; settled is content and finished here.
# Gender pinned. Structured Caption. No artist names.
plus_label: Yearn
minus_label: Settled
recommended_range: [-2.0, 2.0]
# Declared slider axis for --lm_target v9 (not plus_label, not a row's pos-neg).
slider_positive: "Reaching for something out of reach."
slider_negative: "Settled, present, content."

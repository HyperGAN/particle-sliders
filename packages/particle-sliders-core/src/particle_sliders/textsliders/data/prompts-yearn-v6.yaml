    positive: "Global Metadata:\nGenre: distant slow pop. BPM 68. Longing, someone missing, an empty doorway. Wide far mix, the voice calls out.\nVocal Details:\nOne sung vocal reaching for someone who is not here: stretched line-ends, a call across the room, come-back phrasing, delay on the last word. Not crying, not a lullaby. Sung, not rapped.\nArrangement:\nIntro: a far guitar and an empty bar. Verse: slow bass, space between hits, a delay throw. Chorus: the vocal calls farther, the last word repeats into empty air, nothing lands closed."
    negative: "Global Metadata:\nGenre: present pop. BPM 108. Here and finished, the room is full, nothing missing. Close even mix.\nVocal Details:\nOne settled sung vocal, I'm-here phrasing, lines that close on the downbeat, no reach, no absence, no come-back. Sung, not rapped.\nArrangement:\nIntro: kit and keys on time. Verse: bass locked, guitar present in the room. Chorus: the last line lands and stays, no delay throw, no far pad."

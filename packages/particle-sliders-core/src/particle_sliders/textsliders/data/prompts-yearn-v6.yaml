# Yearn axis v6 (LM half) — plus = longing for someone not in the room,
# minus = here and finished.
#
# v6-noendreg retrain. The v4 pair failed (window cos+ negative): "yearn" and
# "settled" are weak tokens and the poles overlapped tender (held vowels,
# crack). This rewrite stacks concrete absence language (far, missing, empty
# doorway, calling out, come back) vs presence (I'm here, home, enough, the
# last line lands). Not a wound-crack (hurt) and not tender-care. Gender
# pinned. Structured Caption. No artist names.
plus_label: Yearn
minus_label: Settled
recommended_range: [-2.0, 2.0]

    positive: "Global Metadata:\nGenre: wounded slow pop. BPM 68. The blow already landed, a late indoor quiet. Close dry-warm mix.\nVocal Details:\nOne hurt sung vocal that is crying through the line: a sob in the throat, the voice breaks on the long notes, a crack mid-phrase, can barely finish the sentence. Not a gentle hush, not a snarl, not a whisper-lullaby. Sung, not rapped.\nArrangement:\nIntro: spare piano and room tone. Verse: that piano, a low bass, no snare. Chorus: a second guitar enters quietly, the break in the voice stays, no crash."
    negative: "Global Metadata:\nGenre: blank pop. BPM 108. Numb, sealed, nothing gets in. Clean studio mix.\nVocal Details:\nOne deadpan even vocal, flat affect, emotionless, no crack, no sob, no catch, blank and unhurt, finished. Sung, not rapped.\nArrangement:\nIntro: clean kit and keys. Verse: bass, guitar, the blank vocal. Chorus: stacked doubles, no break in the lead, no extra air."

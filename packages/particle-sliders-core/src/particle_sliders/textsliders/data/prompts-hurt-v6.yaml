# Hurt axis v6 (LM half) — plus = wounded / voice breaking, minus = numb deadpan.
#
# v6-noendreg retrain. The v4 pair failed (window cos ~0.14/0.12): "hurt" and
# "numb" were too close to tender-care. This rewrite stacks crack/sob/crying
# language vs blank/deadpan/no-feeling, and keeps it off tender (no hush,
# no held-vowel care) and off yearn (no absence, no come-back). Medium level
# both sides. Gender pinned. Structured Caption. No artist names.
plus_label: Hurt
minus_label: Numb
recommended_range: [-2.0, 2.0]

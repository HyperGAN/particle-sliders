# Grit axis uni-v1 — plus-only. One concept: rasp / fry / gravel in the cords.
#
# Teacher is raw h+ (the + caption). Do not leftover-gate. Omit leak_*.
# Train with --lm_target faithful_plus_neu --pole_mode hidden. Unipolar: there
# is no smooth pole. negative := target for yaml shape / canary; it is not
# taught. Do not teach −1.
#
# Same pop / indie / electronic room as v4 target. Genre, BPM, and kit are
# pinned; only the + grit words appear, in Vocal Details. Not amp distortion,
# not louder. Gender attributes pin the vocalist (expand prefixes). Sung,
# not rapped. No artist names.

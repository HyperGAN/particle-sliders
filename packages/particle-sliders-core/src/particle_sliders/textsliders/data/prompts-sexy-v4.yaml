    lyrics: "[verse]\nI can feel it in the air tonight\n[chorus]\nLouder now or fade away"
  - target: "Global Metadata:\nGenre: indie rock. BPM 118. Moderate intensity, steady and controlled. Ordinary studio mix.\nVocal Details:\nOne lead vocalist, ordinary rock timbre, phrasing on the beat, no backing vocals. Sung, not rapped.\nArrangement:\nVerse and chorus with steady drums, guitars present but controlled, and bass."
    positive: "Global Metadata:\nGenre: slow nocturnal R&B rock. BPM 70. Heavy-lidded, body-close, after last call. Dry and warm, the room is small.\nVocal Details:\nOne chest-led vocal into a close capsule, lazy behind the beat, grain on the edges, breath at the lips, not a whisper and not a belt. Sung, not rapped.\nArrangement:\nIntro: a round bass and a late snare, hats closed. Verse: muted low guitar, hip sway, kick on one and three. Chorus: the bass blooms, a close stacked harmony, no crash, the pocket stays late."
    negative: "Global Metadata:\nGenre: brisk indie pop-rock. BPM 132. Upright, daylight, a rehearsal room with the lights on. Dry forward mix.\nVocal Details:\nOne belted mid-register rock vocal, consonants on the beat, no close-mic heat, no behind-the-beat drag. Sung, not rapped.\nArrangement:\nIntro: stick click into a bright snare. Verse: ringing guitars, bass locked to the kick, hats open a little. Chorus: crash on the downbeat, doubled vocal, everything standing up straight."
    neutral: "Global Metadata:\nGenre: indie rock. BPM 118. Moderate intensity, steady and controlled. Ordinary studio mix.\nVocal Details:\nOne lead vocalist, ordinary rock timbre, phrasing on the beat, no backing vocals. Sung, not rapped.\nArrangement:\nVerse and chorus with steady drums, guitars present but controlled, and bass."

    positive: "Global Metadata:\nGenre: quiet-storm slow jam. BPM 74. Warm late-night heat, unhurried, a dark bedroom not a stage. Dry close mix, little air around the kit.\nVocal Details:\nOne close-mic chest vocal a finger from the capsule, behind the beat, half-spoken edges, audible mouth air, low register, private. Sung, not rapped, not whispered-only.\nArrangement:\nIntro: dry kick and a round sub, snare late, almost no cymbal. Verse: hip-pocket groove, muted guitar stabs, the vocal sits on the kick. Chorus: the sub swells, a delayed clap, backing hums close and stacked, still no splashy cymbal."
    negative: "Global Metadata:\nGenre: daylight radio pop. BPM 124. Bright athletic energy, a clean afternoon, nothing seductive. Forward dry mix, kit in your face.\nVocal Details:\nOne far-mic belted pop vocal, on the front of the beat, de-essed, stacked doubles, no mouth air, no chest-close heat. Sung, not rapped.\nArrangement:\nIntro: four-on-the-floor click into a bright snare. Verse: punchy dry kit, bright guitar, bass on the downbeat. Chorus: open hats, doubled vocal, radio chorus, everything on the grid."
    neutral: "Global Metadata:\nGenre: pop. BPM 104. Medium energy, even mood, ordinary radio listening. Balanced studio mix.\nVocal Details:\nOne clear lead vocal, ordinary timbre, even phrasing on the beat, no backing vocals. Sung, not rapped.\nArrangement:\nVerse and chorus with drums, bass and guitar at a comfortable level."

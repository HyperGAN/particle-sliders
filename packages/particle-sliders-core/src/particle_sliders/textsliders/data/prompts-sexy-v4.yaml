    positive: "Global Metadata:\nGenre: slow dark R&B electronic. BPM 76. Close, humid, a headphone at one in the morning. Dry-warm mix, sub forward, treble tucked.\nVocal Details:\nOne close dry vocal in the chest, behind the grid, mouth on the mic, low and private, sung with speech at the edges. Not rapped, not a lullaby whisper.\nArrangement:\nIntro: analog sub and a late rim. Verse: sparse keys, kick in the hip, hats off. Chorus: the sub opens, a soft stacked close harmony, no bright lead synth, the groove stays late."
    negative: "Global Metadata:\nGenre: bright synth pop. BPM 128. Athletic, fluorescent, a daytime playlist. Clean forward mix, treble up.\nVocal Details:\nOne bright belted synth-pop vocal, on the grid, no close-mic mouth air, no delayed pocket. Sung, not rapped.\nArrangement:\nIntro: four-on-the-floor and a bright arpeggio. Verse: punchy programmed kit, bass on the downbeat. Chorus: open hats, stacked radio doubles, lead synth on top, everything on time."

# Sexy axis v4 (LM half) — plus = close body-music, minus = athletic/plain.
#
# Not breath (already a slider) and not loud/quiet (energy). The poles move
# groove, mic distance, time-feel and register: behind-the-beat chest vocal
# in a hip pocket vs on-the-beat belted daylight pop. Genre, BPM and kit all
# move with the axis (MUSIC3.md divergent-poles). Gender pinned via attributes.
# Structured Caption because the studio rewriter only emits that at runtime.
# No artist names.
plus_label: Sexy
minus_label: Plain
recommended_range: [-2.0, 2.0]
# Declared slider axis for --lm_target v9 (not plus_label, not a row's pos-neg).
slider_positive: "Close behind-the-beat body-music."
slider_negative: "Athletic daylight plain delivery."
rows:

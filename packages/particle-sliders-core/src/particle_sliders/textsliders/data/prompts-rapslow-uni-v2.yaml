# Rapslow axis uni-v2 — plus-only. One concept: the lead is RAP. Not spoken
# word, not a talky sung verse, not patter. Real rapped bars over the same bed.
#
# Teacher is raw h+ at LoRA +1. +2 is shred (double-time / unintelligible) —
# do not put that in the teacher. Do not leftover-gate. Omit leak_*. Unipolar:
# there is no slow pole. negative := target. minus_label Off. Do not teach −1.
#
# Same pop / r&b pop room as uni-v1. Genre, BPM, mix, kit, and arrangement
# stay on the + pole so the wow is this song, now rapped. Only Vocal Details
# flip: sung lead → rapped bars. Neutral must be clearly sung (not half
# spoken) so the LoRA has a real delta. Do not jump BPM. Do not swap the
# band for boom-bap/trap. Gender pins name a lead voice, not "singing".
# No artist names.
plus_label: Rap
minus_label: "Off"
recommended_range: [0.0, 1.0]
slider_positive: "Rapped bars, 16th-note flow in the pocket, rhymes on the snare, chest-talk on pitch. Rap, not sung, not spoken-word."
slider_negative: "Ordinary sung lead, held vowels, sung contour."

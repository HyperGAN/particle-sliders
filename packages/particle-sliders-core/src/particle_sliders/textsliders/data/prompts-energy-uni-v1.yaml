# Energy axis uni-v1 — plus-only. One concept: loud / slammed.
#
# Teacher is raw h+ (the + caption). Do not leftover-gate. Omit leak_*.
# Train with --lm_target faithful_plus --pole_mode hidden. Unipolar: there
# is no quiet pole. negative := target for yaml shape / canary; it is not
# taught. Do not teach −1.
#
# Same pop / indie / electronic room as v4. Genre, BPM, mix, and kit are
# pinned; only the + energy words appear, in Global Metadata. No hushed /
# dissolved / weightless leftover ambient. Gender attributes pin the
# vocalist (expand prefixes). Sung, not rapped. No artist names.
plus_label: Loud
minus_label: "Off"
recommended_range: [0.0, 2.0]
slider_positive: "Loud slammed energy."
slider_negative: "Medium energy, neither loud nor quiet."

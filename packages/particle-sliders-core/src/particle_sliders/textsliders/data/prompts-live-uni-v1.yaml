# Live axis uni-v1 — plus-only. One concept: bleed / crowd / human time.
#
# Teacher is raw h+ (the + caption). Do not leftover-gate. Omit leak_*.
# Train with --lm_target faithful_plus --pole_mode hidden. Unipolar: there
# is no booth/grid pole. negative := target for yaml shape / canary; it is
# not taught. Do not teach −1.
#
# Same pop / indie / soul-pop room as v4. BPM and energy are pinned; only
# the + live words appear, in Global Metadata. Not bigger reverb, not louder.
# Gender attributes pin the vocalist (expand prefixes). Sung, not rapped.
# No artist names.
plus_label: Live
minus_label: "Off"
recommended_range: [0.0, 2.0]
slider_positive: "Bleed, crowd, and human time."
slider_negative: "Ordinary production, no crowd."

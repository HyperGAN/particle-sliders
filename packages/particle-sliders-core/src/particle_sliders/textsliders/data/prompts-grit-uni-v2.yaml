# Grit axis uni-v2 — plus-only. One concept: chest gravel on pitch.
#
# Teacher is raw h+ at LoRA +1. +2 is shred (scream-fry / torn cords) — do
# not put that in the teacher. Do not leftover-gate. Omit leak_*. Unipolar:
# there is no smooth pole. negative := target. minus_label Off. Do not teach −1.
#
# Same pop / indie / electronic room as uni-v1. Genre, BPM, mix, kit, and
# arrangement are pinned; only the + grit words appear, in Vocal Details.
# Not amp distortion, not louder, not hurt/wound, not rap, not metal scream.
# Gender attributes pin the vocalist. Sung, not rapped. No artist names.

    positive: "Global Metadata:\nGenre: pop. BPM 108. Weathered and ragged, smoke in the room. Raw forward mix.\nVocal Details:\nOne rasped lead vocal, fry on the low notes, mid-chest growl on the hook, edges fraying on purpose. Sung, not screamed, not rapped.\nArrangement:\nGritty overdriven guitar accents, heavy-handed drums, coarse bass, nothing buffeted smooth."
    negative: "Global Metadata:\nGenre: pop. BPM 108. Glass-smooth polish. Silky refined mix.\nVocal Details:\nOne silky lead vocal, flawless even vibrato, zero rasp, satin sustain. Sung, not rapped.\nArrangement:\nClean guitars, soft precise drums, rounded bass, everything buffed."

  positive: 'Genre: live pop. BPM: 112. Medium energy. A live band in a small club,
    drum-kit bleed on the vocal mic, imperfect human time-feel, room mics, a count-in,
    an audible audience that cheers on the chorus hits. Not a huge hall, not more
    reverb — people and leakage. Sung, not rapped.'
  negative: 'Genre: studio pop. BPM: 112. Medium energy. Programmed quantized drums,
    isolated overdubbed tracks, click-tight, no bleed, no crowd, no count-in, every
    part recorded separately in a booth. Grid-perfect. Sung, not rapped.'
  neutral: 'Genre: pop. BPM: 112. Medium energy. A song that could be a studio session
    or a small-room performance. Ordinary production, no crowd mentioned. Sung, not
    rapped.'

# Joy axis uni-v1 — plus-only. One concept: lifted joyful / smile in the grain.
#
# Teacher is raw h+ (the + caption). Do not leftover-gate. Omit leak_*.
# Train with --lm_target faithful_plus_neu --pole_mode hidden. Unipolar: there
# is no somber pole. negative := target for yaml shape / canary; it is not
# taught. Do not teach −1.
#
# Same pop / indie / electronic room as v4 target. Genre, BPM, and loudness
# are pinned; only the + joy words appear, in Vocal Details. Not louder
# energy, not BPM up. Gender attributes pin the vocalist (expand prefixes).
# Sung, not rapped. No artist names.
plus_label: Joy
minus_label: "Off"
recommended_range: [0.0, 2.0]
slider_positive: "Lifted joyful, a smile in the grain."
slider_negative: "Ordinary mood, neither joyful nor somber."

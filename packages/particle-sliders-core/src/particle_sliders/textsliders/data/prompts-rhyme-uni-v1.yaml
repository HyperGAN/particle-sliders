# Rhyme axis uni-v1 — plus-only. One concept: dense rhyme.
#
# Teacher is raw h+ (the + caption). Do not leftover-gate. Omit leak_*.
# Train with --lm_target faithful_plus --pole_mode hidden. Unipolar: there
# is no unrhymed pole. negative := target for yaml shape / canary; it is not
# taught. Do not teach −1.
#
# Same pop room as v4. Genre, BPM, mix, and kit are pinned; only the +
# rhyme words appear, in Vocal Details. Gender attributes pin the vocalist
# (expand prefixes). Sung, not rapped. No artist names.

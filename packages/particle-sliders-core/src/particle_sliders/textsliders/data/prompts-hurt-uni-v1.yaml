# Hurt axis uni-v1 — plus-only. One concept: wounded / crack / fold in the voice.
#
# Teacher is raw h+ (the + caption). Do not leftover-gate. Omit leak_*.
# Train with --lm_target faithful_plus_neu --pole_mode hidden. Unipolar: there
# is no numb pole. negative := target for yaml shape / canary; it is not
# taught. Do not teach −1.
#
# Same pop / indie / electronic room as v4 target. Genre, BPM, and loudness
# are pinned; only the + hurt words appear, in Vocal Details. Not tender-hush,
# not slower BPM. Gender attributes pin the vocalist (expand prefixes). Sung,
# not rapped. No artist names.

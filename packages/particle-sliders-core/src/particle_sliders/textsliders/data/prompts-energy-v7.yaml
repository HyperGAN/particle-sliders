# Energy axis v7 (LM half) — plus = loud/dense, minus = quiet/sparse.
#
# Pinned-BPM rewrite: every cell sits at BPM 110 so tempo cannot ride the axis
# (v4 leaked +100..119 BPM between poles and taught the teacher to move tempo).
# Pole deltas touch level/density/instrumentation only. Gender pinned via
# attributes. Structured Caption. No artist names.
plus_label: Loud
minus_label: Quiet
recommended_range: [-2.0, 2.0]
# Declared slider axis for --lm_target v9 (not plus_label, not a row's pos-neg).
slider_positive: "Extremely high energy, aggressive and loud."
slider_negative: "Extremely quiet and calm, almost silent."

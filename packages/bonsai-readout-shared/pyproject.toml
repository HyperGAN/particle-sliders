[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "_bonsai_build"
backend-path = ["."]

[project]
name = "bonsai-readout-shared"
version = "0.1.0"
description = "Opt-in ParticleGAN and HyperGAN/HNDL Bonsai identity/readout-only preview"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "particle-sliders-core[hypergan-hndl] @ git+https://github.com/HyperGAN/particle-sliders.git@4abc0eb03a4e3a84fc3e6d02734c13dc7e8ea231#subdirectory=packages/particle-sliders-core",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["bonsai_readout_shared"]

[project.entry-points."particle_sliders.response_backends"]
bonsai-gguf-shared = "bonsai_readout_shared.binding:TRAINING"
bonsai-readout-fixture = "bonsai_readout_shared.binding:FIXTURE_TRAINING"

[project.entry-points."particle_sliders.inference_backends"]
bonsai-gguf-shared = "bonsai_readout_shared.binding:INFERENCE"
bonsai-readout-fixture = "bonsai_readout_shared.binding:FIXTURE_INFERENCE"

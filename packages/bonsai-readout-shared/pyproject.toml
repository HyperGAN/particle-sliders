[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai-readout-shared"
version = "0.1.0"
description = "Opt-in shared ParticleGAN and HyperGAN/HNDL Bonsai readout binding"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "particle-sliders-core[hypergan-hndl] @ git+https://github.com/HyperGAN/particle-sliders.git@4abc0eb03a4e3a84fc3e6d02734c13dc7e8ea231#subdirectory=packages/particle-sliders-core",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["conceptmod.textsliders"]

[project.entry-points."particle_sliders.response_backends"]
bonsai-gguf-shared = "conceptmod.textsliders.bonsai_gguf_shared:TRAINING"
bonsai-readout-fixture = "conceptmod.textsliders.bonsai_gguf_shared:FIXTURE_TRAINING"

[project.entry-points."particle_sliders.inference_backends"]
bonsai-gguf-shared = "conceptmod.textsliders.bonsai_gguf_shared:INFERENCE"
bonsai-readout-fixture = "conceptmod.textsliders.bonsai_gguf_shared:FIXTURE_INFERENCE"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tinyqwen-shared-preview"
version = "0.1.0"
description = "Bounded TinyQwen shared ParticleGAN / HyperGAN / HNDL CPU preview"
requires-python = ">=3.11,<3.15"
dependencies = ["particle-sliders-core[hypergan-hndl]==0.12.0"]

[project.entry-points."particle_sliders.response_backends"]
tinyqwen-shared-preview = "conceptmod.textsliders.tiny_llm_shared:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
tinyqwen-shared-preview = "conceptmod.textsliders.tiny_llm_shared:INFERENCE"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.force-include]
"../../conceptmod/__init__.py" = "conceptmod/__init__.py"
"../../conceptmod/textsliders/__init__.py" = "conceptmod/textsliders/__init__.py"
"../../conceptmod/textsliders/tiny_llm_backend.py" = "conceptmod/textsliders/tiny_llm_backend.py"
"../../conceptmod/textsliders/tiny_llm_shared.py" = "conceptmod/textsliders/tiny_llm_shared.py"
"../../conceptmod/textsliders/tiny_llm_shared.lock.json" = "conceptmod/textsliders/tiny_llm_shared.lock.json"

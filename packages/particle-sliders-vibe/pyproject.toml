[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-sliders-vibe"
version = "0.2.0"
description = "Persistent best-of-N finished-output curation and adaptive prompts for Particle Sliders"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
image = ["pillow", "numpy", "opencv-python-headless"]
nanoodle = ["nanoodle>=0.7.0,<1"]
test = ["pytest>=8", "pillow>=13.0.0"]

[project.scripts]
particle-slider-vibe = "particle_sliders_vibe:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["particle_sliders_vibe"]

[tool.setuptools.package-data]
particle_sliders_vibe = ["image_panel.json"]

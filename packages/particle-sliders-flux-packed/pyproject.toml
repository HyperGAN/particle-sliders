[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-sliders-flux-packed-preview"
version = "0.1.0"
description = "Flux packed-token native prerequisites; shared training admission blocked"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "particle-sliders-core[hypergan-hndl] @ git+https://github.com/HyperGAN/particle-sliders.git@7a8a321d04323d49319d0b08e6093a0ddce36b27#subdirectory=packages/particle-sliders-core",
  "diffusers==0.38.0",
  "transformers==4.57.6",
  "safetensors==0.8.0",
  "pillow>=13.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "build", "setuptools>=84.2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ps_flux_packed_preview = ["*.hndl", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

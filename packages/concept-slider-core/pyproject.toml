[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-slider-core"
version = "0.2.0"
description = "Shared routed-particle training primitives and LoRA fitting"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
concept_slider_core = ["LICENSE", "provenance.json", "locked_provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

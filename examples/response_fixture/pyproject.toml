[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slider-vector-example"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["particle-sliders-core==0.8.3"]

[tool.setuptools]
py-modules = ["vector_example"]

[project.entry-points."particle_sliders.response_backends"]
vector-fixture = "vector_example:TRAINING"

[project.entry-points."particle_sliders.inference_backends"]
vector-fixture = "vector_example:INFERENCE"

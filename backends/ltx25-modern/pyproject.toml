[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "particle-sliders-ltx25-modern-preview"
version = "0.1.0"
description = "Opt-in CPU-qualified experimental LTX video-field GAN cohort"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "particle-sliders-core[hypergan-hndl] @ git+https://github.com/HyperGAN/particle-sliders.git@4abc0eb03a4e3a84fc3e6d02734c13dc7e8ea231#subdirectory=packages/particle-sliders-core",
]

[project.entry-points."particle_sliders.response_backends"]
ltx25-modern-video-gan = "conceptmod.textsliders.ltx25_gan:backend"

[project.entry-points."particle_sliders.inference_backends"]
ltx25-modern-video-gan = "conceptmod.textsliders.ltx25_gan:inference_backend"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "conceptmod.textsliders.ltx25_gan",
  "conceptmod.textsliders.ltx25_backend",
  "conceptmod.textsliders.ltx25_uni",
  "conceptmod.textsliders.slider_targets",
]

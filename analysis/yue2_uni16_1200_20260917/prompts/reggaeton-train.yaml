- neutral: 'Global Metadata:

    Genre: contemporary song. BPM 84. Meter: 4/4. The verse is focused and the chorus opens into a fuller
    sound. A balanced studio mix with a clear lead, defined bass and modest room depth.

    Vocal Details:

    One adult lead vocalist. Melodic singing with clear words and natural phrasing. A clear solo lead
    stays in front throughout, with natural vocal detail and light room ambience.

    Arrangement:

    Verse: Piano chords carry the harmony over electric bass and a steady light drum kit.

    Chorus: The piano chords broaden and the rhythm adds a light accent at the section change, leaving
    space for the lead.'
  positive: 'Global Metadata:

    Genre: reggaeton. BPM 84. Meter: 4/4. The verse is focused and the chorus opens into a fuller sound.
    A clear percussive mix with a rounded sub foundation and close dry lead.

    Vocal Details:

    One adult lead vocalist. Melodic singing with clear words and natural phrasing. A clear solo lead
    stays in front throughout, with natural vocal detail and light room ambience.

    Arrangement:

    Verse: A repeating dembow kick and snare pattern drives rounded sub bass, clipped keyboard plucks
    and light hand percussion.

    Chorus: An answering synth hook and extra shaker widen the groove while the dembow accents stay unmistakable.'
  lyrics: '[verse]

    The corner shop has changed its hours

    I leave my bicycle outside

    Your folded note is in my pocket

    The traffic clears on either side

    [chorus]

    There is a seat beside the window

    I keep it open for a while'

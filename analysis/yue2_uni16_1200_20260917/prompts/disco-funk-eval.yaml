rows:
- neutral: 'Global Metadata:

    Genre: electronic song. BPM 118. Meter: 4/4. The verse is focused and the chorus opens into a fuller
    sound. A balanced studio mix with a clear lead, defined bass and modest room depth.

    Vocal Details:

    One adult male lead vocalist. Melodic singing with clear words and natural phrasing. A clear solo
    lead stays in front throughout, with natural vocal detail and light room ambience.

    Arrangement:

    Verse: Short synth chords carry the harmony over soft synth bass and a sparse electronic beat.

    Chorus: The short synth chords broaden and the rhythm adds a light accent at the section change, leaving
    space for the lead.'
  positive: 'Global Metadata:

    Genre: disco funk. BPM 118. Meter: 4/4. The verse is focused and the chorus opens into a fuller sound.
    A bright warm dance-band mix with lively bass articulation and crisp percussion.

    Vocal Details:

    One adult male lead vocalist. Melodic singing with clear words and natural phrasing. A clear solo
    lead stays in front throughout, with natural vocal detail and light room ambience.

    Arrangement:

    Verse: An elastic electric bass line moves under clipped sixteenth-note rhythm guitar, a steady kick,
    snare and open hats; hand percussion adds syncopation.

    Chorus: Short string swells and brass-like keyboard accents lift the chords while the bass and guitar
    keep their interlocking dance groove.'
  lyrics: '[verse]

    The painted number leaves the mailbox

    A crooked nail holds on the frame

    We take a brush out to the pavement

    And give the little door a name

    [chorus]

    The street is changing by the hour

    But there is room for us to stay'
